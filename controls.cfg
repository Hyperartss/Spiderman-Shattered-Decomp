# PC keyboard + mouse controls for sd360, read by run.sh.
#
# Each line is a ReXGlue cvar, passed to the game as --name=value. The game
# only knows Xbox 360 pad buttons, so every key here is bound to one of those;
# the comment says what that button does in Spider-Man: Shattered Dimensions.
# Values are comma-separated alternatives. Key names: A-Z, 0-9, Space, Return,
# Escape, Tab, Backspace, Up/Down/Left/Right, LMB/RMB/MMB, Semicolon, Quote,
# ... (src/ui/keybinds.cpp in the SDK). Shift, Control and Alt are modifiers
# only and cannot be bound on their own.
#
# Source for the PC layout: the only PC keys documented online are WASD to
# move, Space to jump, Enter to select and Esc to back out / quit
# (digit.in forum, 2010), plus mouse look (PCGamingWiki). Everything marked
# [guess] is a placeholder until checked against the PC version's own
# controls screen.

mnk_mode=true
mnk_mouse=true                    # mouse moves the camera (right stick)
mnk_sensitivity=1.0

# Movement (left stick)
keybind_lstick_up=W
keybind_lstick_down=S
keybind_lstick_left=A
keybind_lstick_right=D
keybind_lstick_press=             # unused by the game; frees F

# Camera keys off: the mouse does it, the arrows go to the d-pad below
keybind_rstick_up=
keybind_rstick_down=
keybind_rstick_left=
keybind_rstick_right=
keybind_rstick_press=MMB          # R3: reset camera            [guess]

keybind_a=Space,Return            # A: jump / menu accept
keybind_x=LMB                     # X: fast attack (hold: charge) [guess]
keybind_y=RMB                     # Y: strong attack             [guess]
keybind_b=E,Backspace             # B: grab, web-grab, interact / menu back [guess]

keybind_right_trigger=F           # RT: web-zip (tap), web-swing (hold) [guess]
keybind_left_trigger=Q            # LT: dodge (with a direction + Space: roll) [guess]
keybind_right_shoulder=R          # RB: web-shot                 [guess]
keybind_left_shoulder=C           # LB: rage (Ultimate) / accelerated vision (2099) [guess]

keybind_dpad_up=Up,V              # D-pad up: spider-sense       [guess: V]
keybind_dpad_down=Down
keybind_dpad_left=Left
keybind_dpad_right=Right

keybind_start=Escape              # Start: pause menu
keybind_back=Tab                  # Back: Web of Destiny         [guess]
